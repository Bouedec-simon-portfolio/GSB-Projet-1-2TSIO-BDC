<VirtualHost *:8080>
    ServerName 127.0.0.1
    DocumentRoot /var/www/gsb-ci/public
    <Directory /var/www/gsb-ci/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
